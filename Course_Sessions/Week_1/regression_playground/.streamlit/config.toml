# Regression Playground: warm course palette, readable body text, serif headings
# supplied by theme.py. The darker primary colour meets WCAG AA contrast on both
# the page and card backgrounds.
[theme]
base = "light"
primaryColor = "#934C1F"
backgroundColor = "#F4F1EA"
secondaryBackgroundColor = "#ECE7DC"
textColor = "#171A23"
font = "sans-serif"

[browser]
gatherUsageStats = false
