<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="A concise COMP8831 group project presentation example, with an instruction page and computed results from simulated stock data.">
  <title>Group project presentation example</title>
  <style>:root {
  --canvas:#fbfcfa;--paper:#fff;--ink:#17221c;--muted:#4f5d55;--line:#d9ded8;
  --forest:#17623b;--brand:#63a537;--lime:#99cb38;--blue:#1d5d86;--cyan:#40a9c9;
  --amber:#8a5a00;--coral:#c95038;--navy:#071a2b;--purple:#5b4b9e;
  --heading:Georgia,Cambria,"Times New Roman",serif;
  --body:Aptos,"Avenir Next","Segoe UI",Arial,sans-serif;
}
* { box-sizing:border-box; }
html,body { margin:0;width:100%;height:100%; }
body { overflow:hidden;background:#e7ebe7;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased; }
button,a { font:inherit;color:inherit; }
button { cursor:pointer; }
button:focus-visible,a:focus-visible,[tabindex]:focus-visible { outline:4px solid #e5a736;outline-offset:4px; }
#viewport { position:fixed;inset:0;overflow:hidden; }
#stage { position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;background:var(--canvas);border-radius:12px;box-shadow:0 28px 70px #04161124; }
.slide { position:absolute;inset:0;width:1600px;height:900px;display:none;flex-direction:column;padding:64px 76px 126px;gap:20px;overflow:hidden;background:var(--canvas); }
.slide.active { display:flex; }
.slide:before { content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--forest); }
.slide-header { display:flex;gap:30px;justify-content:space-between;align-items:flex-start;flex-shrink:0; }
.header-copy { min-width:0;flex:1; }
.kicker { display:flex;align-items:center;gap:14px;font-size:18px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--forest);margin:0; }
.kicker:before { content:"";height:4px;width:34px;background:var(--forest);border-radius:2px; }
.slide h1 { font:700 58px/1.06 var(--heading);letter-spacing:-.035em;margin:13px 0 12px; }
.subtitle { font-size:25px;line-height:1.3;color:var(--muted);margin:0; }
.brand { width:188px;height:64px;object-fit:contain;margin-top:1px;flex-shrink:0; }
.slide-content { flex:1;min-height:0;display:flex;flex-direction:column;gap:18px; }
h2,h3,p,figure { margin:0; }
h2 { font-family:var(--heading);font-size:34px;line-height:1.15; }
h3 { font-size:23px;font-weight:700;line-height:1.2; }
.small { font-size:18px;line-height:1.35;color:var(--muted); }
.source-note { font-size:17px;line-height:1.3;color:var(--muted); }
.tabular { font-variant-numeric:tabular-nums; }
svg { display:block;width:100%;height:100%;overflow:visible; }
.guide-grid { display:grid;grid-template-columns:1.35fr 1fr;gap:52px;flex:1;min-height:0; }
.required-pages { display:flex;flex-direction:column;gap:0; }
.page-rule { display:grid;grid-template-columns:72px 1fr;gap:18px;padding:13px 0;border-bottom:1px solid var(--line);align-items:start; }
.page-rule strong { font-size:24px;color:var(--forest); }
.page-rule p { font-size:23px;line-height:1.25; }
.page-rule b { font-weight:750; }
.guide-aside { display:flex;flex-direction:column;gap:16px; }
.time-strip { display:grid;grid-template-columns:1fr 1fr;border-top:3px solid var(--forest);border-bottom:1px solid var(--line);padding:15px 0;gap:25px; }
.time-strip strong { display:block;font:700 47px/1.1 var(--heading);letter-spacing:-.035em;color:var(--forest); }
.time-strip span { display:block;font-size:21px;margin-top:6px; }
.guide-aside p { font-size:23px;line-height:1.35; }
.omit { border-left:4px solid var(--coral);padding-left:19px; }
.omit h3 { color:var(--coral);margin-bottom:9px; }
.omit p { font-size:22px; }
.guide-source { margin-top:auto;font-size:18px!important;color:var(--muted); }
.start-example { align-self:flex-start;border:1px solid var(--forest);background:var(--forest);color:white;border-radius:12px;min-height:46px;padding:10px 22px;font-size:21px; }
.cover { padding:76px 84px 126px; }
.cover .cover-top { display:flex;justify-content:space-between;align-items:flex-start; }
.cover .brand { width:214px;height:88px; }
.cover-main { display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;flex:1;min-height:0; }
.cover h1 { font-size:86px;line-height:1.03;margin:16px 0 23px;max-width:720px; }
.cover .subtitle { font-size:28px;line-height:1.35;max-width:620px; }
.cover-members { display:flex;flex-wrap:wrap;gap:10px 24px;list-style:none;padding:0;margin:30px 0 0;font-size:24px; }
.cover-context { font-size:21px;color:var(--forest);font-weight:700;margin-bottom:7px; }
.cover-chart { height:430px;min-width:0; }
.cover .source-note { margin-top:24px; }
.problem-layout { display:grid;grid-template-columns:.85fr 1.4fr;gap:52px;flex:1;min-height:0;align-items:center; }
.problem-copy { display:flex;flex-direction:column;gap:24px; }
.problem-copy h3 { font-size:26px;color:var(--forest);margin-bottom:8px; }
.problem-copy p { font-size:24px;line-height:1.4; }
.problem-figure { height:450px; }
.dataset-layout { display:grid;grid-template-columns:1.05fr 1fr;gap:45px;flex:1;min-height:0; }
.dataset-details { display:flex;flex-direction:column;gap:12px; }
.shape-strip { display:flex;gap:30px;border-bottom:1px solid var(--line);padding:6px 0 14px; }
.shape-strip strong { display:block;font-size:48px;line-height:1.1;color:var(--forest); }
.shape-strip span { display:block;font-size:20px;margin-top:7px; }
.dataset-details>p { font-size:23px;line-height:1.35; }
.dataset-details>.source-note { font-size:18px;line-height:1.3; }
.feature-list { display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;margin:0;padding:0;list-style:none; }
.feature-list li { font-size:22px;line-height:1.25;padding-left:17px;border-left:3px solid var(--line); }
.target-line { padding-top:17px;border-top:2px solid var(--forest); }
.target-line strong { display:block;font-size:23px;color:var(--forest);margin-bottom:6px; }
.distribution-stack { display:grid;grid-template-rows:1fr 1fr 1fr;gap:12px;min-height:0; }
.histogram { min-height:0; }
.ownership { width:100%;border-collapse:collapse;margin-top:8px; }
.ownership th { font-size:19px;font-weight:700;text-align:left;color:var(--muted);padding:14px 20px;border-bottom:2px solid var(--ink); }
.ownership td { padding:16px 20px;border-bottom:1px solid var(--line);font-size:28px; }
.ownership td:first-child { width:120px;font-size:52px;font-family:var(--heading);color:var(--forest); }
.ownership .student { font-size:32px;font-weight:700; }
.ownership .role { font-size:22px;color:var(--muted); }
.owner-note { font-size:22px;color:var(--muted);margin-top:16px; }
.metrics-strip { display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:12px 0 16px;flex-shrink:0; }
.metric { padding:0 15px 0 0;min-height:86px; }
.metric+.metric { border-left:1px solid var(--line);padding-left:23px; }
.metric .label { font-size:19px;color:var(--muted);display:block;margin-bottom:6px; }
.metric .value { display:block;font-size:43px;line-height:1.05;font-weight:750;letter-spacing:-.04em;color:var(--model-colour,var(--forest)); }
.result-body { display:grid;grid-template-columns:1.55fr 1fr;gap:36px;min-height:0;flex:1; }
.forecast-panel,.confusion-panel { display:flex;flex-direction:column;gap:8px;min-height:0; }
.forecast-panel h3,.confusion-panel h3 { font-size:22px; }
.forecast-panel svg { flex:1;min-height:150px; }
.confusion-panel svg { flex:1;min-height:150px; }
.forecast-readout { font-size:18px;line-height:1.3;color:var(--muted);height:25px;flex-shrink:0;font-variant-numeric:tabular-nums; }
.result-bottom { display:grid;grid-template-columns:1.05fr 1fr;gap:45px;flex-shrink:0;height:142px; }
.importance { display:flex;flex-direction:column;gap:4px;min-height:0; }
.importance h3 { font-size:22px; }
.importance svg { flex:1;min-height:0; }
.finding { border-left:3px solid var(--model-colour,var(--forest));padding:3px 0 0 21px; }
.finding h3 { font-size:23px;margin-bottom:8px; }
.finding p { font-size:22px;line-height:1.35; }
.model-results .slide-content { gap:15px; }
.model-results .subtitle { font-size:23px; }
.result-note { font-size:17px;line-height:1.25;color:var(--muted);flex-shrink:0; }
.summary-table { width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums; }
.summary-table th { text-align:right;font-size:19px;line-height:1.25;padding:17px 12px;border-bottom:2px solid var(--ink);font-weight:700; }
.summary-table th:first-child,.summary-table td:first-child { text-align:left;width:310px; }
.summary-table th:nth-child(2),.summary-table td:nth-child(2) { text-align:left;width:240px; }
.summary-table td { padding:16px 12px;border-bottom:1px solid var(--line);text-align:right;font-size:26px;line-height:1.15; }
.summary-table td:first-child { font-size:25px; }
.summary-table .selected { background:#e9f3e2; }
.summary-table .selected td { font-weight:750;color:var(--forest); }
.summary-table .selected td:first-child { box-shadow:inset 5px 0 var(--forest);padding-left:21px; }
.selected-label { display:block;font-size:18px;margin-top:7px;font-weight:700; }
.decision-strip { display:grid;grid-template-columns:1fr 1fr;gap:45px;margin-top:10px; }
.decision-strip strong { display:block;font:700 31px/1.2 var(--heading);color:var(--forest);margin-bottom:8px; }
.decision-strip p { font-size:23px;line-height:1.35; }
.decision-strip aside { border-left:1px solid var(--line);padding-left:30px; }
.summary-source { margin-top:auto; }
#presentation-nav { position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:7px;border:1px solid var(--line);border-radius:18px;background:#fffffff5;z-index:20;box-shadow:0 10px 24px #17221c0d; }
#presentation-nav button { width:44px;height:44px;border:1px solid var(--line);border-radius:11px;background:white;font-size:23px;font-weight:800; }
#presentation-nav button:disabled { color:#a6afa9;cursor:default; }
#slide-counter { min-width:102px;text-align:center;font-size:21px;font-weight:750;color:var(--muted);font-variant-numeric:tabular-nums; }
#page-context { position:absolute;left:76px;bottom:49px;z-index:20;font-size:18px;font-weight:700;color:var(--forest); }
#quick-controls { position:absolute;right:76px;bottom:37px;display:flex;gap:8px;z-index:20; }
#quick-controls button { min-height:44px;background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 11px;font-size:17px;color:var(--muted); }
#quick-controls button:hover { background:#edf4ea;border-color:var(--line); }
#progress-track { position:absolute;left:76px;right:76px;bottom:15px;height:4px;border-radius:4px;background:var(--line);z-index:20; }
#progress-fill { height:100%;width:10%;background:var(--brand);border-radius:4px; }
.dialog-backdrop { display:none;position:fixed;inset:0;padding:5vh 6vw;background:#071a2be6;z-index:100;align-items:center;justify-content:center; }
.dialog-backdrop.open { display:flex; }
.dialog { background:var(--canvas);border-radius:20px;padding:28px;width:min(1120px,94vw);max-height:86vh;display:flex;flex-direction:column;gap:24px;box-shadow:0 20px 80px #0005; }
.dialog-head { display:flex;justify-content:space-between;align-items:center;gap:20px; }
.dialog h2 { font-size:32px; }
.dialog button { min-height:44px;border:1px solid var(--line);border-radius:10px;background:white;padding:8px 16px; }
#overview-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:auto; }
.overview-item { text-align:left;display:flex;gap:16px;align-items:center;font-size:20px; }
.overview-item[aria-current="page"] { border:2px solid var(--forest);background:#edf4ea; }
.help { width:min(800px,94vw); }
.help dl { display:grid;grid-template-columns:170px 1fr;gap:18px;font-size:20px;line-height:1.35; }
.help dt { font-weight:700; }
.help dd { margin:0; }
@media print {
  @page { size:16in 9in;margin:0; }
  html,body { width:1536px;height:auto;background:white;overflow:visible; }
  #viewport { position:static;width:1536px;overflow:visible; }
  #stage { position:static;left:auto;top:auto;width:1600px;height:auto;zoom:.96;overflow:visible;transform:none!important;border-radius:0;box-shadow:none; }
  .slide,.slide.active { display:flex!important;position:relative;inset:auto;page-break-after:always;break-after:page;border-radius:0; }
  .slide:last-child { page-break-after:auto;break-after:auto; }
  #presentation-nav,#page-context,#quick-controls,#progress-track,.dialog-backdrop,.start-example { display:none!important; }
  .forecast-readout { color:var(--muted); }
  * { -webkit-print-color-adjust:exact;print-color-adjust:exact; }
}
@media (prefers-reduced-motion:reduce) { * { transition:none!important;animation:none!important; } }

<body>
  <main id="viewport" aria-label="Group project presentation">
    <div id="stage">
      <div id="deck"></div>
      <div id="page-context" aria-live="polite">Presentation instructions</div>
      <nav id="presentation-nav" aria-label="Presentation controls">
        <button id="previous-slide" aria-label="Previous page">&lt;</button>
        <span id="slide-counter" aria-live="polite">Guide</span>
        <button id="next-slide" aria-label="Next page">&gt;</button>
      </nav>
      <div id="quick-controls">
        <button id="overview-button" aria-label="Open page overview">Pages</button>
        <button id="fullscreen-button" aria-label="Toggle fullscreen">Fullscreen</button>
        <button id="help-button" aria-label="Open keyboard help">?</button>
      </div>
      <div id="progress-track" aria-label="Overall progress"><div id="progress-fill"></div></div>
    </div>
  </main>
  <div id="overview" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="overview-title" aria-hidden="true">
    <div class="dialog">
      <div class="dialog-head"><h2 id="overview-title">Presentation pages</h2><button data-close-dialog>Close</button></div>
      <div id="overview-grid"></div>
    </div>
  </div>
  <div id="help-dialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="help-title" aria-hidden="true">
    <div class="dialog help">
      <div class="dialog-head"><h2 id="help-title">Presentation controls</h2><button data-close-dialog>Close</button></div>
      <dl><dt>Next / previous</dt><dd>Arrow keys, Page Down / Page Up, Space</dd>
      <dt>First / last</dt><dd>Home / End</dd><dt>Page overview</dt><dd>O</dd>
      <dt>Fullscreen</dt><dd>F</dd><dt>Help / close</dt><dd>? / Escape</dd>
      <dt>Inspect a forecast</dt><dd>Point at a results chart, or focus it and use Left / Right.</dd></dl>
      <button id="restart-presentation">Restart from the instruction page</button>

  </div>

const guideBody=
 header('Before your presentation','Your group presentation','Required pages only. This instruction page is outside the example presentation.')+
 '<div class="slide-content"><div class="guide-grid"><div class="required-pages">'+[
  ['P1','<b>Title.</b> Project title and group members.'],
  ['P2','<b>Introduction.</b> Problem, why it matters and why machine learning.'],
  ['P3','<b>Dataset.</b> Source, type, shape, feature count/types/distributions and target. No preparation.'],
  ['P4','<b>Models.</b> List the baseline separately. Name the student responsible for each advanced model.'],
  ['P5+','<b>Results.</b> One page per model. Show suitable metrics and figures on the same evaluation cases.'],
  ['Final','<b>Comparison.</b> One results table. Highlight the group’s final model and justify the choice briefly.']
 ].map(r=>'<div class="page-rule"><strong>'+r[0]+'</strong><p>'+r[1]+'</p></div>').join('')+
 '</div><aside class="guide-aside"><div class="time-strip"><div><strong>6-8 min</strong><span>Group presentation</span></div><div><strong>2-4 min</strong><span>Q&A afterwards</span></div></div>'+
 '<p>Each student owns <strong>one advanced model</strong> and must know it well enough to answer the lecturer’s questions.</p>'+
 '<p>Report the results during the talk. Save model explanations for Q&A.</p>'+
 '<div class="omit"><h3>Leave out</h3><p>Code, data processing/preparation, algorithm theory, architecture diagrams and extra slides.</p></div>'+
 '<p class="guide-source">Use your actual project data and measured results. This example uses fictional names and simulated market data.</p>'+

ver-main"><div><p class="cover-context">Group project example</p><h1>Next-day stock price prediction</h1><p class="subtitle">Forecast tomorrow’s price change.<br>Compare the models on the same future days.</p><ul class="cover-members">'+exampleData.models.filter(m=>m.student).map(m=>'<li>'+htmlEscape(m.student)+'</li>').join('')+'</ul><p class="source-note">Fictional students. Computed results from simulated stock data.</p></div><figure class="cover-chart">'+priceHistoryChart(true)+'</figure></div>';
const introBody=header('P2. Introduction','The forecasting problem','At the end of today, predict the change in the next trading day’s closing price.')+
 '<div class="slide-content"><div class="problem-layout"><div class="problem-copy"><div><h3>Problem</h3><p>Tomorrow’s closing price is unknown. Use only information available at today’s close.</p></div><div><h3>Why it matters</h3><p>Forecast errors affect planning and risk estimates. A useful model must improve on a simple baseline.</p></div><div><h3>Why machine learning</h3><p>Market, volume and sentiment signals may interact. Compare linear and nonlinear models instead of assuming one will win.</p></div></div><figure class="problem-figure">'+priceHistoryChart(false)+'</figure></div><p class="source-note">A controlled simulation for demonstrating a project presentation. No investment-performance claim.</p></div>';
const datasetBody=header('P3. Dataset','One stock, 2,000 ordered observations','Time-ordered numerical records for a fictional stock. One row represents one trading day.')+
 '<div class="slide-content"><div class="dataset-layout"><div class="dataset-details"><div class="shape-strip"><div><strong>2,000</strong><span>Observations</span></div><div><strong>10</strong><span>Input features</span></div><div><strong>2,000 × 10</strong><span>Feature-matrix shape</span></div></div>'+
 '<p><strong>Types:</strong> 9 continuous features. Volume is an integer count.</p><ul class="feature-list">'+exampleData.features.map(f=>'<li>'+f+'</li>').join('')+'</ul>'+
 '<p class="target-line"><strong>Target: next-day price change (USD)</strong>ΔP = next close - today’s close. Shape: (2,000,).<br>Forecast close = today’s close + predicted ΔP.</p><p class="source-note">Source: reproducible simulated market series, seed 42. Direction is a derived check: predicted ΔP &gt; 0 means Up.</p></div><div class="distribution-stack"><figure class="histogram">'+histogramChart('close','Closing price','USD')+'</figure><figure class="histogram">'+histogramChart('volume','Trading volume','million shares')+'</figure><figure class="histogram">'+histogramChart('target','Target: next-day change','USD')+'</figure></div></div></div>';
const ownershipBody=header('P4. Model ownership','Three students, one model each','The baseline is a shared reference. Each advanced model has one student owner.')+
 '<div class="slide-content"><table class="ownership"><thead><tr><th>Model</th><th>Approach</th><th>Student responsible</th><th>Role</th></tr></thead><tbody>'+
 exampleData.models.map((m,i)=>'<tr><td>0'+(i+1)+'</td><td>'+m.name+'</td><td class="student">'+htmlEscape(m.student||'')+'</td><td class="role">'+m.role+'</td></tr>').join('')+
 '</tbody></table><p class="owner-note">Three students own the advanced models. The baseline has no assigned student.</p><p class="source-note">Fictional names supplied for this example. Replace them with your group members.</p></div>';
function modelBody(model,number){
 const metrics=[['MAE (USD)',dollars(model.mae)],['MSE (USD²)',fixed(model.mse)],['R² (price change)',fixed(model.r2)],['Direction accuracy',percent(model.accuracy)],['F1 (Up)',fixed(model.f1)]];
 return header('P'+number+'. Results',model.name,(model.student?'Owner: '+htmlEscape(model.student)+'. Advanced model.':'Baseline reference.')+' Same 400-day chronological test set.')+
 '<div class="slide-content"><div class="metrics-strip">'+metrics.map(([label,value])=>'<div class="metric"><span class="label">'+label+'</span><strong class="value tabular">'+value+'</strong></div>').join('')+
 '</div><div class="result-body"><figure class="forecast-panel"><h3>Actual and forecast price change: first 60 test days</h3><div data-chart-host="'+model.id+'" style="flex:1;min-height:0">'+forecastChart(model)+'</div><figcaption class="forecast-readout" data-readout="'+model.id+'" aria-live="polite">'+forecastReadout(model,0)+'</figcaption></figure>'+
 '<figure class="confusion-panel"><h3>Direction confusion matrix</h3>'+confusionChart(model)+'<figcaption class="small">Actual rows. Predicted columns. Up is positive.</figcaption></figure></div>'+
 '<div class="result-bottom"><figure class="importance"><h3>Feature importance</h3>'+importanceChart(model)+'</figure><aside class="finding"><h3>Interpretation</h3><p>'+modelFinding(model)+'</p></aside></div>'+
 '<p class="result-note">All metrics use 400 test days. Direction comes from the sign of the price-change forecast. R² measures price-change fit. Simulated data.</p></div>';
}
function summaryBody(){
 const bestTest=[...exampleData.models].sort((a,b)=>a.mae-b.mae)[0],gap=Math.abs(chosenModel.mae-bestTest.mae);
 return header('P9. Group conclusion','Results and final model','Final selection uses validation MAE. The same untouched test period evaluates every model.')+
 '<div class="slide-content"><table class="summary-table"><thead><tr><th>Model</th><th>Owner</th><th>Validation<br>MAE ($)</th><th>Test<br>MAE ($)</th><th>Test MSE<br>($²)</th><th>Test R²<br>(change)</th><th>Direction<br>accuracy</th><th>F1<br>(Up)</th></tr></thead><tbody>'+
 exampleData.models.map(m=>'<tr class="'+(m.id===chosenModel.id?'selected':'')+'"'+(m.id===chosenModel.id?' data-selected-model="'+m.id+'"':'')+'><td>'+m.name+(m.id===chosenModel.id?'<span class="selected-label">Group final model</span>':'')+'</td><td>'+htmlEscape(m.student||'')+'</td><td>'+fixed(m.validation_mae)+'</td><td>'+fixed(m.mae)+'</td><td>'+fixed(m.mse)+'</td><td>'+fixed(m.r2)+'</td><td>'+percent(m.accuracy)+'</td><td>'+fixed(m.f1)+'</td></tr>').join('')+
 '</tbody></table><div class="decision-strip"><div><strong>Selected: '+chosenModel.name+'</strong><p>Lowest validation MAE: '+dollars(chosenModel.validation_mae)+'. Retain that choice after reporting the test results.</p></div><aside><strong>The trade-off</strong><p>Boosted trees have a '+dollars(gap)+' lower test MAE. That small test advantage does not justify changing a validation-led selection.</p></aside></div>'+
 '<p class="source-note summary-source">Simulated data. Test results cover 400 future observations: '+exampleData.test_up+' Up and '+exampleData.test_not_up+' Not up. These findings do not establish real-market performance.</p></div>';
}
const slides=[
 {id:'instructions',title:'Your group presentation',page:0,type:'guide',body:guideBody},
 {id:'title',title:'Next-day stock price prediction',page:1,type:'cover',body:coverBody},

 {id:'dataset',title:'One stock, 2,000 ordered observations',page:3,type:'content',body:datasetBody},
 {id:'models',title:'Three students, one model each',page:4,type:'content',body:ownershipBody},
 ...exampleData.models.map((m,i)=>({id:'results-'+m.id,title:m.name,page:5+i,type:'model-results',model:m.id,body:modelBody(m,5+i)})),
 {id:'summary',title:'Results and final model',page:9,type:'content',body:summaryBody()}
];

function showSlide(index,updateHash=true){
 currentSlideIndex=Math.max(0,Math.min(slides.length-1,Number(index)||0));
 document.querySelectorAll('.slide').forEach((el,i)=>{
  el.classList.toggle('active',i===currentSlideIndex);
  el.setAttribute('aria-hidden',String(i!==currentSlideIndex));
 });
 const s=slides[currentSlideIndex];
 document.getElementById('slide-counter').textContent=s.page?String(s.page).padStart(2,'0')+' / 09':'Guide';
 document.getElementById('page-context').textContent=s.page?'P'+s.page+'. '+(s.type==='cover'?'Project title':s.title):'Presentation instructions';
 document.getElementById('previous-slide').disabled=currentSlideIndex===0;
 document.getElementById('next-slide').disabled=currentSlideIndex===slides.length-1;
 document.getElementById('progress-fill').style.width=(currentSlideIndex+1)/slides.length*100+'%';
 document.querySelectorAll('[data-page-jump]').forEach((el,i)=>{
  if(i===currentSlideIndex)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');
 });
 if(updateHash)window.history.replaceState(null,'','#slide-'+(currentSlideIndex+1));
}
function scaleStage(){
 const ratio=Math.min(innerWidth/1600,innerHeight/900);
 stage.style.transform='translate(-50%,-50%) scale('+ratio+')';
 stage.dataset.scale=ratio;
}
function openDialog(id){
 lastDialogFocus=document.activeElement;
 const dialog=document.getElementById(id);
 dialog.classList.add('open');dialog.setAttribute('aria-hidden','false');
 dialog.querySelector('button').focus();
}
function closeDialogs(){
 const restore=lastDialogFocus;lastDialogFocus=null;
 document.activeElement?.blur?.();
 document.querySelectorAll('.dialog-backdrop').forEach(el=>{el.classList.remove('open');el.setAttribute('aria-hidden','true');});
 if(restore?.isConnected)restore.focus();
}
function inspectForecast(id,index,focus=false){
 index=Math.max(0,Math.min(59,index));
 const model=exampleData.models.find(m=>m.id===id);
 plotSelections[id]=index;
 const host=document.querySelector('[data-chart-host="'+id+'"]');
 host.innerHTML=forecastChart(model,index);
 document.querySelector('[data-readout="'+id+'"]').textContent=forecastReadout(model,index);
 if(focus)host.querySelector('svg').focus();
}
function restartPresentation(){
 closeDialogs();
 for(const id of Object.keys(plotSelections))inspectForecast(id,0);
 showSlide(0);document.activeElement?.blur?.();
}
function followHash(){
 const hash=window.location.hash.slice(1),match=hash.match(/^slide-(\d+)$/);
 if(match)showSlide(Number(match[1])-1,false);
 else {const i=slides.findIndex(s=>s.id===hash);showSlide(i<0?0:i,false);}
}
document.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button)return;
 if(button.id==='next-slide')showSlide(currentSlideIndex+1);
 if(button.id==='previous-slide')showSlide(currentSlideIndex-1);
 if(button.id==='overview-button')openDialog('overview');
 if(button.id==='help-button')openDialog('help-dialog');
 if(button.id==='fullscreen-button'){
  if(document.fullscreenElement)document.exitFullscreen?.();else stage.requestFullscreen?.();
 }
 if(button.hasAttribute('data-page-jump')){showSlide(Number(button.dataset.pageJump));closeDialogs();}
 if(button.hasAttribute('data-close-dialog'))closeDialogs();
 if(button.hasAttribute('data-start-example'))showSlide(1);
 if(button.id==='restart-presentation')restartPresentation();
 if(e.detail>0)button.blur();
});
document.addEventListener('pointermove',e=>{
 const svg=e.target.closest('svg[data-forecast]');if(!svg)return;
 const point=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());
 const index=Math.max(0,Math.min(59,Math.round((point.x-61)/730*59)));
 if(index!==plotSelections[svg.dataset.forecast])inspectForecast(svg.dataset.forecast,index);
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeDialogs();return;}
 const dialog=document.querySelector('.dialog-backdrop.open');
 if(dialog){
  if(e.key==='Tab'){
   const controls=[...dialog.querySelectorAll('button,a,[tabindex]')].filter(x=>!x.disabled),first=controls[0],last=controls.at(-1);
   if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
   else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }return;
 }
 const chart=e.target.closest('[data-forecast]');
 if(chart){
  const id=chart.dataset.forecast;
  if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
   e.preventDefault();inspectForecast(id,e.key==='Home'?0:e.key==='End'?59:plotSelections[id]+(e.key==='ArrowRight'?1:-1),true);
  }return;
 }
 if(e.target.closest('button,a,input,select,textarea,[contenteditable]'))return;
 if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showSlide(currentSlideIndex+1);}
 if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();showSlide(currentSlideIndex-1);}
 if(e.key==='Home'){e.preventDefault();showSlide(0);}
 if(e.key==='End'){e.preventDefault();showSlide(slides.length-1);}
 if(e.key.toLowerCase()==='o')openDialog('overview');
 if(e.key==='?')openDialog('help-dialog');
 if(e.key.toLowerCase()==='f'){
  if(document.fullscreenElement)document.exitFullscreen?.();else stage.requestFullscreen?.();
 }
});
window.addEventListener('resize',scaleStage);
window.addEventListener('hashchange',followHash);
scaleStage();followHash();
</script>
</body>
</html>
